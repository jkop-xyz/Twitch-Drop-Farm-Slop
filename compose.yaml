services:
  dropbot:
    # Prebuilt image from GitHub Actions. `docker compose up --build` builds locally instead.
    image: ghcr.io/jkop-xyz/twitch-drop-farm-slop:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Postgres (primary). Leave unset to use SQLite in the data volume.
      DATABASE_URL: ${DATABASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - dropbot-data:/data
    # Runs as uid 10001 (set in the image). Locked down further here:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  dropbot-data:
